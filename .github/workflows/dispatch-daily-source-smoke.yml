name: One-time R2 mirror sync after full production refresh
on:
  push:
    branches:
      - test/daily-source-refresh-dispatch-20261030
    paths:
      - .github/workflows/dispatch-daily-source-smoke.yml
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish only validated R2 mirrors after five successful source refreshes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run sync-r2.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'R2_SYNC_AFTER_FULL_REFRESH_DISPATCHED'
