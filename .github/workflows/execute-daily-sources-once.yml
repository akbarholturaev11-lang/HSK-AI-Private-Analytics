name: One-time execution of five source-refresh requests
on:
  push:
    branches:
      - test/daily-source-refresh-dispatch-20261030
    paths:
      - .github/workflows/execute-daily-sources-once.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test existing overview and 4 scoped endpoints serially
        env:
          REFRESH_TOKEN: ${{ secrets.HSKAI_MANUAL_AGGREGATE_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${REFRESH_TOKEN:-}"
          endpoint='https://hskai.app/api/internal/admin-pwa/analytics/refresh'
          response="$(curl --silent --show-error --fail --max-time 90 \
            --request POST --header "Authorization: Bearer $REFRESH_TOKEN" \
            --header 'Content-Type: application/json' --data '{}' "$endpoint")"
          printf '%s' "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True and d.get("section")=="overview" and set(d.get("periods",{}))=={"weekly","monthly","all_time"}'
          echo 'PRODUCTION_OVERVIEW_BUNDLE_OK'
          for section in course funnel money sources; do
            response="$(curl --silent --show-error --fail --max-time 80 \
              --request POST --header "Authorization: Bearer $REFRESH_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "{\"section\":\"$section\",\"period\":\"weekly\"}" "$endpoint")"
            printf '%s' "$response" | EXPECTED="$section" python3 -c 'import json,os,sys; d=json.load(sys.stdin); assert d.get("ok") is True and d.get("section")==os.environ["EXPECTED"] and set(d.get("periods",{}))=={"weekly"}'
            echo "PRODUCTION_SECTION_REFRESH_OK $section"
          done
          echo 'ALL_FIVE_PRODUCTION_REFRESH_STEPS_OK'
