name: One-time verified live section refresh smoke (feature branch only)
on:
  push:
    branches:
      - feat/daily-r2-analytics-warming-20261030
    paths:
      - .github/workflows/smoke-analytics-live.yml

permissions:
  contents: read
  actions: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify owner-authenticated scoped production refresh
        env:
          REFRESH_TOKEN: ${{ secrets.HSKAI_MANUAL_AGGREGATE_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${REFRESH_TOKEN:-}"
          response="$(curl --silent --show-error --fail --max-time 80 \
            --request POST \
            --header "Authorization: Bearer $REFRESH_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"section":"funnel","period":"weekly"}' \
            https://hskai.app/api/internal/admin-pwa/analytics/refresh)"
          printf '%s' "$response" | python3 -c 'import json,sys,datetime; d=json.load(sys.stdin); assert d.get("ok") is True and d.get("section")=="funnel" and set(d.get("periods",{}))=={"weekly"}; stamp=d["periods"]["weekly"]["generated_at"]; assert datetime.datetime.fromisoformat(stamp).tzinfo; print("SCOPED_PRODUCTION_REFRESH_OK generated_at="+stamp)'
      - name: Trigger existing R2-only GitHub archive sync after source confirmation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run sync-r2.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'VERIFIED_R2_SYNC_QUEUED'
